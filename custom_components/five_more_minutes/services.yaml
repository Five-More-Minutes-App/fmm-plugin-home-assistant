start_timer:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: five_more_minutes
          multiple: true
    minutes:
      example: 30
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: min
          mode: box
    until:
      example: "20:00:00"
      selector:
        time:
    message:
      example: Homework
      selector:
        text:

extend_timer:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: five_more_minutes
          multiple: true
    minutes:
      example: 10
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: min
          mode: box

end_time:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: five_more_minutes
          multiple: true

cancel_timer:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: five_more_minutes
          multiple: true
