name: ci

on:
  push:
    branches: [main]
  pull_request:

# The token can read this repository and do nothing else; a job that needs more says so itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install pytest-homeassistant-custom-component ruff mypy
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy custom_components --ignore-missing-imports
      - run: pytest

  hacs:
    # HACS's own check that the repository can be added as a custom repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  hassfest:
    # Home Assistant's own check of the manifest, translations and services.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  manifest:
    # The check the plugin registry runs on a pull request, so a mistake is found here first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: Five-More-Minutes-App/fmm-plugin-registry
          path: registry
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
        working-directory: registry
      - run: node registry/scripts/validate.mjs --manifest fmm-plugin.json

  version:
    # A change to the integration is a new version. If the files a Home Assistant gets differ from the last release under the
    # same number, HACS has nothing to offer as an update and the marketplace shows a version that is not the one installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every tag, to find the last release.
          fetch-depth: 0
      - name: The version is higher than the last release when the integration has changed
        run: |
          set -euo pipefail
          last="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          if [ -z "$last" ]; then
            echo "No release yet."
            exit 0
          fi
          version="$(python3 -c "import json; print(json.load(open('custom_components/five_more_minutes/manifest.json'))['version'])")"
          if git diff --quiet "$last" HEAD -- custom_components fmm-plugin.json; then
            echo "Nothing in the integration has changed since $last."
            exit 0
          fi
          highest="$(printf '%s\n%s\n' "${last#v}" "$version" | sort -V | tail -1)"
          if [ "$version" = "${last#v}" ] || [ "$highest" != "$version" ]; then
            echo "::error::The integration has changed since $last but the version is $version. Raise it in manifest.json, fmm-plugin.json and pyproject.toml, and add it to CHANGELOG.md."
            exit 1
          fi
          echo "The integration has changed since $last, and the version is $version."
