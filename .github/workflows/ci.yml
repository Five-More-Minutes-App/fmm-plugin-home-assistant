name: ci

on:
  push:
    branches: [main]
  pull_request:

# The token can read this repository and do nothing else; a job that needs more says so itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: pip install pytest-homeassistant-custom-component ruff mypy
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy custom_components --ignore-missing-imports
      - run: pytest

  hacs:
    # HACS's own check that the repository can be added as a custom repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  hassfest:
    # Home Assistant's own check of the manifest, translations and services.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@50baf3a307f87100cf550d4ae127746595030d5d # master

  manifest:
    # The check the plugin registry runs on a pull request, so a mistake is found here first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: Five-More-Minutes-App/fmm-plugin-registry
          path: registry
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: registry
      - run: node registry/scripts/validate.mjs --manifest fmm-plugin.json
